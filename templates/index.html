<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NIFTY OPTION CHAIN</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#020617;
font-family:Arial;
color:white;
overflow-x:hidden;
}

.header{
padding:18px;
background:#0f172a;
font-size:28px;
font-weight:bold;
text-align:center;
color:#38bdf8;
}

.container{
padding:15px;
}

.card-grid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:12px;
}

.card{
background:#111827;
padding:15px;
border-radius:14px;
}

.card h4{
color:#94a3b8;
margin-bottom:10px;
font-size:13px;
}

.card h2{
font-size:22px;
}

.trade-box{
margin-top:15px;
background:#111827;
padding:18px;
border-radius:14px;
}

.trade-box h2{
margin-bottom:12px;
color:#22c55e;
}

.chart-grid{
margin-top:15px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.chart-box{
background:#111827;
padding:15px;
border-radius:14px;
}

.table-box{
margin-top:15px;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
background:#111827;
min-width:1000px;
}

th{
background:#1e293b;
padding:12px;
font-size:13px;
}

td{
padding:10px;
text-align:center;
border-top:1px solid #1e293b;
font-size:13px;
}

.call{
color:#ef4444;
font-weight:bold;
}

.put{
color:#22c55e;
font-weight:bold;
}

.strike{
background:#312e81;
font-weight:bold;
}

@media(max-width:900px){

.card-grid{
grid-template-columns:repeat(2,1fr);
}

.chart-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">

📊 NIFTY OPTION CHAIN AI ANALYTICS

</div>

<div class="container">

<div class="card-grid">

<div class="card">
<h4>PCR</h4>
<h2 id="pcr">0</h2>
</div>

<div class="card">
<h4>RSI</h4>
<h2 id="rsi">0</h2>
</div>

<div class="card">
<h4>EMA</h4>
<h2 id="ema">0</h2>
</div>

<div class="card">
<h4>VWAP</h4>
<h2 id="vwap">0</h2>
</div>

<div class="card">
<h4>Signal</h4>
<h2 id="signal">-</h2>
</div>

<div class="card">
<h4>Support</h4>
<h2 id="support">0</h2>
</div>

<div class="card">
<h4>Resistance</h4>
<h2 id="resistance">0</h2>
</div>

<div class="card">
<h4>Max Pain</h4>
<h2 id="maxPain">0</h2>
</div>

<div class="card">
<h4>Total Call OI</h4>
<h2 id="callOi">0</h2>
</div>

<div class="card">
<h4>Total Put OI</h4>
<h2 id="putOi">0</h2>
</div>

</div>

<!-- ================================================= -->

<div class="trade-box">

<h2>

🔥 SMART INTRADAY ENTRY

</h2>

<div id="bestTrade">

⏳ Waiting For High Probability Setup

</div>

</div>

<!-- ================================================= -->

<div class="chart-grid">

<div class="chart-box">
<canvas id="oiChart"></canvas>
</div>

<div class="chart-box">
<canvas id="changeChart"></canvas>
</div>

<div class="chart-box">
<canvas id="pcrChart"></canvas>
</div>

<div class="chart-box">
<canvas id="painChart"></canvas>
</div>

</div>

<!-- ================================================= -->

<div class="table-box">

<table>

<thead>

<tr>

<th>Call OI</th>
<th>Call Chg</th>
<th>Call LTP</th>
<th>Strike</th>
<th>Put LTP</th>
<th>Put Chg</th>
<th>Put OI</th>
<th>PCR</th>

</tr>

</thead>

<tbody id="tbody">

</tbody>

</table>

</div>

</div>

<script>

let oiChart;
let changeChart;
let pcrChart;
let painChart;

async function fetchData(){

try{

const response =
await fetch("/api/market-data");

const data =
await response.json();

if(!data.success){
console.log(data.error);
return;
}

// =====================================================
// TOP CARDS
// =====================================================

document.getElementById("pcr").innerHTML =
data.pcr || 0;

document.getElementById("rsi").innerHTML =
data.rsi || 0;

document.getElementById("ema").innerHTML =
data.ema || 0;

document.getElementById("vwap").innerHTML =
data.vwap || 0;

document.getElementById("support").innerHTML =
data.support || 0;

document.getElementById("resistance").innerHTML =
data.resistance || 0;

document.getElementById("maxPain").innerHTML =
data.max_pain || 0;

document.getElementById("signal").innerHTML =
data.signal.signal || "-";

document.getElementById("signal").style.color =
data.signal.color || "#fff";

document.getElementById("callOi").innerHTML =
(data.total_call_oi || 0).toLocaleString();

document.getElementById("putOi").innerHTML =
(data.total_put_oi || 0).toLocaleString();

// =====================================================
// BEST TRADE
// =====================================================

if(data.best_option){

document.getElementById("bestTrade").innerHTML = `

<div style="line-height:2;">

<h2 style="color:#22c55e;">
${data.best_option.type}
</h2>

<b>Strike :</b>
${data.best_option.strike}

<br>

<b>Entry :</b>
₹${data.best_option.entry}

<br>

<b>Target :</b>
₹${data.best_option.target}

<br>

<b>Stoploss :</b>
₹${data.best_option.stoploss}

<br>

<b>Confidence :</b>
${data.best_option.confidence}

<br><br>

<b>Reasons :</b>

<br>

${data.best_option.reasons.join("<br>")}

</div>
`;

}else{

document.getElementById("bestTrade").innerHTML = `

<div style="
padding:12px;
background:#27272a;
border-radius:10px;
">

⏳ Waiting For High Probability Setup

</div>
`;

}

// =====================================================
// TABLE
// =====================================================

const tbody = document.getElementById("tbody");

tbody.innerHTML = "";

data.data.forEach(row=>{

const pcr = (

row.put_oi /

(row.call_oi || 1)

).toFixed(2);

tbody.innerHTML += `

<tr>

<td class="call">
${row.call_oi.toLocaleString()}
</td>

<td class="call">
${row.call_change.toLocaleString()}
</td>

<td class="call">
${row.call_ltp}
</td>

<td class="strike">
${row.strike}
</td>

<td class="put">
${row.put_ltp}
</td>

<td class="put">
${row.put_change.toLocaleString()}
</td>

<td class="put">
${row.put_oi.toLocaleString()}
</td>

<td>
${pcr}
</td>

</tr>
`;

});

// =====================================================
// LABELS
// =====================================================

const labels =
data.data.map(x=>x.strike);

// =====================================================
// OI CHART
// =====================================================

if(oiChart)
oiChart.destroy();

oiChart = new Chart(

document.getElementById("oiChart"),

{
type:"line",

data:{

labels:labels,

datasets:[

{
label:"Call OI",

data:data.data.map(
x=>x.call_oi
),

borderColor:"#ef4444",

tension:0.4
},

{
label:"Put OI",

data:data.data.map(
x=>x.put_oi
),

borderColor:"#22c55e",

tension:0.4
}
]
}
}
);

// =====================================================
// CHANGE CHART
// =====================================================

if(changeChart)
changeChart.destroy();

changeChart = new Chart(

document.getElementById("changeChart"),

{
type:"bar",

data:{

labels:labels,

datasets:[

{
label:"Call Change",

data:data.data.map(
x=>x.call_change
),

backgroundColor:"#ef4444"
},

{
label:"Put Change",

data:data.data.map(
x=>x.put_change
),

backgroundColor:"#22c55e"
}
]
}
}
);

// =====================================================
// PCR CHART
// =====================================================

if(pcrChart)
pcrChart.destroy();

pcrChart = new Chart(

document.getElementById("pcrChart"),

{
type:"line",

data:{

labels:labels,

datasets:[

{
label:"PCR",

data:data.data.map(

x=>(

x.put_oi /

(x.call_oi || 1)

).toFixed(2)
),

borderColor:"#8b5cf6",

tension:0.4
}
]
}
}
);

// =====================================================
// PAIN CHART
// =====================================================

if(painChart)
painChart.destroy();

painChart = new Chart(

document.getElementById("painChart"),

{
type:"line",

data:{

labels:data.pain_chart.map(
x=>x.strike
),

datasets:[

{
label:"Pain",

data:data.pain_chart.map(
x=>x.pain
),

borderColor:"#06b6d4",

tension:0.4
}
]
}
}
);

}
catch(err){

console.log(err);

}

}

fetchData();

setInterval(
fetchData,
15000
);

</script>

</body>
</html>
